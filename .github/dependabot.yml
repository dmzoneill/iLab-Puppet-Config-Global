---
# Managed by https://github.com/dmzoneill/dmzoneill setup.sh.
# Entries follow manifests detected in this repository.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "maven"
    directories:
      - "/environments/global/modules_thirdparty/apt/.forge-release"
      - "/environments/global/modules_thirdparty/mysql/.forge-release"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      maven:
        patterns:
          - "*"
